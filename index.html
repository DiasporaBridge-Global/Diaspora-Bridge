<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaspora Bridge - Executive Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(-45deg, #020024, #090979, #00d4ff, #00ffcc);
            background-size: 400% 400%; 
            -webkit-animation: flow 8s ease-in-out infinite;
            animation: flow 8s ease-in-out infinite;
            transform: translateZ(0);
            font-family: 'Space Grotesk', sans-serif; color: #fff;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        @-webkit-keyframes flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        
        .glass-panel {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 12px;
            padding: 40px; width: 100%; max-width: 450px;
        }
        h2 { margin: 0 0 5px; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-size: 11px; color: #8892b0; margin-bottom: 35px; letter-spacing: 3px; text-transform: uppercase; }
        .input-group { margin-bottom: 30px; position: relative; }
        input {
            width: 100%; padding: 10px 0; background: transparent; border: none;
            border-bottom: 1px solid #4a5568; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-bottom: 1px solid #00d4ff; }
        label { position: absolute; top: -14px; left: 0; font-size: 10px; color: #00d4ff; letter-spacing: 1.5px; text-transform: uppercase; }
        button {
            width: 100%; padding: 16px; background: rgba(0, 212, 255, 0.1);
            color: #00d4ff; border: 1px solid #00d4ff; border-radius: 4px; font-size: 13px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.4s;
        }
        button:hover { background: #00d4ff; color: #050505; box-shadow: 0 0 20px rgba(0,212,255,0.6); }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h2>Diaspora Bridge</h2>
        <div class="subtitle">Secure Intake Pipeline</div>
        <form id="clientForm">
            <div class="input-group">
                <label>Project ID</label>
                <input type="text" name="projectId" required>
            </div>
            <div class="input-group">
                <label>Client / Workspace</label>
                <input type="text" name="clientWorkspace" required>
            </div>
            <div class="input-group">
                <label>Source Media Link</label>
                <input type="url" name="sourceVideo" required>
            </div>
            <div class="input-group">
                <label>Executive Directives</label>
                <input type="text" name="clientComments" placeholder="Enter instructions...">
            </div>
            <button type="submit">Initialize Transfer</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('clientForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = form.querySelector('button');
            btn.innerText = "Transmitting...";
            fetch('https://script.google.com/macros/s/AKfycbxVCFJTUFiVds14NesTaW80iq-cB9l_21vlQEDaNTPitD8lDp-o83sXUXkVhv1i1Nw8/exec', { method: 'POST', body: new FormData(form) })
            .then(() => { btn.innerText = "Transmission Complete"; btn.style.background = "#00d4ff"; btn.style.color = "#050505"; setTimeout(() => { btn.innerText = "Initialize Transfer"; btn.style.background = "rgba(0, 212, 255, 0.1)"; btn.style.color = "#00d4ff"; form.reset(); }, 4000); })
            .catch(() => { btn.innerText = "System Failure"; btn.style.borderColor = "#ff4d4d"; btn.style.color = "#ff4d4d"; });
        });
    </script>
</body>
</html>
